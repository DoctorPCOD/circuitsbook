\begin{align*}
\cos^2 \theta + \sin^2 \theta \amp= 1\\
pf^2 + \left(\frac{Q}{|\vec{S}|}\right)^2 \amp= 1\\
\frac{Q^2}{|\vec{S}|^2} \amp= 1 - pf^2\\
Q^2 \amp= |\vec{S}|^2\left(1 - pf^2\right)\\
Q \amp= \sqrt{|\vec{S}|^2\left(1 - pf^2\right)}
\end{align*}
