<div class="displaymath process-math">
\begin{align*}
C\frac{dv(t)}{dt} \amp= \frac{V_{IN}-v(t)}{R}\\
C\frac{dv(t)}{dt} \amp= \frac{V_{IN}}{R} - \frac{v(t)}{R}\\
C\frac{dv(t)}{dt} + \frac{v(t)}{R} \amp= \frac{V_{IN}}{R}\\
\frac{dv(t)}{dt} + \frac{1}{RC}v(t) \amp= \frac{V_{IN}}{RC}
\end{align*}
