\frac{1}{C_{EQ}}	\amp = \frac{1}{C_1} + \frac{1}{C_2}\\
\amp = \frac{C_2}{C_1C_2} + \frac{C_1}{C_1C_2}\\
\amp = \frac{C_1+C_2}{C_1C_2}\\
C_{EQ}			\amp = \frac{C_1C_2}{C_1+C_2}
\end{align*}
