\begin{align*}
v(t) \amp= L\frac{di(t)}{dt} + R_Pi(t)\\
\amp= Li'(t) + R_Pi(t)\\
v(0^+) \amp= Li'(0^+) + R_Pi(0^+)\\
Li'(0^+) \amp= v(0^+) - R_Pi(0^+)\\
i'(0^+) \amp= \frac{v(0^+)-R_Pi(0^+)}{L}
\end{align*}
