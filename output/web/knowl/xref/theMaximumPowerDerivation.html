\amp= \frac{R_{TH}V_{TH}^2}{(2R_{TH})^2}\\
\amp= \frac{R_{TH}V_{TH}^2}{4R_{TH}^2}\\
\amp= \frac{V_{TH}^2}{4R_{TH}}
\end{align*}
