\begin{align*}
\frac{1}{R_{EQ}}	\amp = \frac{1}{R_1} + \frac{1}{R_2}\\
\amp = \frac{R_2}{R_1R_2} + \frac{R_1}{R_1R_2}\\
\amp = \frac{R_1+R_2}{R_1R_2}\\
R_{EQ}			\amp = \frac{R_1R_2}{R_1+R_2}
\end{align*}
